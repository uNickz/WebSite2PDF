site_name: WebSite2PDF
site_description: Render web pages and local HTML files to PDF, from Python or the shell.
site_url: https://unickz.github.io/WebSite2PDF/
site_author: uNickz

repo_url: https://github.com/uNickz/WebSite2PDF
repo_name: uNickz/WebSite2PDF
edit_uri: edit/main/docs/

copyright: Copyright &copy; 2023-2026 uNickz

theme:
  name: material
  custom_dir: docs/overrides
  language: en
  icon:
    repo: fontawesome/brands/github
  features:
    - content.action.edit
    - content.code.copy
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

# The theme override lives under docs/ to keep the repository root clean.
# Everything in docs_dir is copied into the site, so it has to be excluded
# from the output; it is still read as a template through custom_dir.
exclude_docs: |
  overrides/

# mkdocs serve only watches docs_dir and this file by default, so editing a
# docstring would not refresh the API reference without these.
watch:
  - src
  - README.md
  - CHANGELOG.md
  - CONTRIBUTING.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            docstring_section_style: table
            filters: ["!^_"]
            heading_level: 3
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_root_heading: true
            show_signature_annotations: true
            show_source: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            signature_crossrefs: true

markdown_extensions:
  - admonition
  - attr_list
  # Required for the card grid on the home page: without it the Markdown inside
  # a <div markdown> block is emitted verbatim.
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Installation: installation.md
  - User guide: guide.md
  - Command line: cli.md
  - Options reference: options.md
  - Migrating from 0.x: migration.md
  - API reference: api.md
  - Contributing: contributing.md
  - Changelog: changelog.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/uNickz
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/website2pdf/
    - icon: fontawesome/brands/telegram
      link: https://t.me/uNickzProjects
