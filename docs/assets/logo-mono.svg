    </g>
  </mask>
  <path fill="#FFFFFF" mask="url(#chrome)" d="M264 144h496a72 72 0 0 1 72 72v416L584 880H264a72 72 0 0 1-72-72V216a72 72 0 0 1 72-72Z"/>
