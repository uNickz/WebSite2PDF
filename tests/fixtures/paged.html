<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Paged Fixture</title>
    <style>
      .page {
        break-after: page;
        page-break-after: always;
      }
    </style>
  </head>
  <body>
    <div class="page"><h1>Page one</h1></div>
    <div class="page"><h1>Page two</h1></div>
    <div><h1>Page three</h1></div>
  </body>
</html>
